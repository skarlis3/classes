<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDECISION EMERGENCY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;600&family=Share+Tech+Mono&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark industrial theme (default) */
            --bg-primary: #0a0a0c;
            --bg-panel: #141416;
            --bg-inset: #0d0d0f;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --text-warning: #1a1a1c;
            --warning-bg: #e8b832;
            --accent-red: #c43c3c;
            --accent-red-glow: rgba(196, 60, 60, 0.4);
            --accent-red-bright: #e85555;
            --accent-green: #4ca85c;
            --accent-amber: #d4a83c;
            --border: #2a2a2e;
            --border-heavy: #3a3a40;
            --metal-light: #5a5a62;
            --metal-dark: #1a1a1e;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        [data-theme="light"] {
            --bg-primary: #d8d8dc;
            --bg-panel: #e8e8ec;
            --bg-inset: #c8c8cc;
            --text-primary: #1a1a1c;
            --text-secondary: #4a4a52;
            --text-warning: #1a1a1c;
            --warning-bg: #e8b832;
            --accent-red: #b83232;
            --accent-red-glow: rgba(184, 50, 50, 0.3);
            --accent-red-bright: #c43c3c;
            --accent-green: #2a6a38;
            --accent-amber: #9a7a2a;
            --border: #b8b8bc;
            --border-heavy: #a8a8ac;
            --metal-light: #c0c0c4;
            --metal-dark: #a0a0a4;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-panel);
            border: 2px solid var(--metal-light);
            border-radius: 4px;
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            color: var(--text-primary);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .theme-toggle-label {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: 'Share Tech Mono', 'Space Mono', monospace;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: var(--bg-inset);
            border: 2px solid var(--border-heavy);
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--metal-light);
            border-radius: 2px;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 4px var(--shadow);
        }

        [data-theme="light"] .toggle-switch::after {
            transform: translateX(18px);
            background: var(--accent-amber);
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Share Tech Mono', 'Space Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.5rem 0.75rem;
            border: 2px solid var(--metal-light);
            border-radius: 4px;
            transition: all 0.2s ease;
            background: var(--bg-panel);
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 100;
        }

        .back-link:hover,
        .back-link:focus {
            color: var(--text-primary);
            border-color: var(--accent-amber);
            background: var(--bg-inset);
            outline: none;
        }

        /* Control Panel */
        .control-panel {
            background: var(--bg-panel);
            border: 3px solid var(--border-heavy);
            border-radius: 8px;
            padding: 2.5rem 3rem 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                inset 0 1px 0 var(--metal-light),
                0 20px 60px var(--shadow),
                0 0 0 1px var(--metal-dark);
            position: relative;
        }

        /* Panel screws */
        .control-panel::before,
        .control-panel::after {
            content: '⊕';
            position: absolute;
            font-size: 0.9rem;
            color: var(--metal-light);
            top: 0.75rem;
        }

        .control-panel::before { left: 0.75rem; }
        .control-panel::after { right: 0.75rem; }

        /* Warning Header */
        .warning-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .warning-stripes {
            height: 8px;
            background: repeating-linear-gradient(
                -45deg,
                var(--warning-bg),
                var(--warning-bg) 8px,
                #1a1a1c 8px,
                #1a1a1c 16px
            );
            margin-bottom: 1.25rem;
            border-radius: 2px;
        }

        .warning-label {
            display: inline-block;
            background: var(--warning-bg);
            color: var(--text-warning);
            font-family: 'Russo One', 'Space Mono', monospace;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            padding: 0.5rem 1.25rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            border-radius: 3px;
        }

        .warning-title {
            font-family: 'Russo One', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .warning-subtitle {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.7;
            max-width: 340px;
            margin: 0 auto;
            opacity: 0.85;
        }

        /* Status Lights */
        .status-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .status-light {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .light-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border-heavy);
            box-shadow: inset 0 2px 4px var(--shadow);
        }

        .light-indicator.active {
            background: var(--accent-green);
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.2),
                0 0 8px var(--accent-green);
        }

        .light-indicator.standby {
            background: var(--accent-amber);
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.2),
                0 0 8px var(--accent-amber);
            animation: pulse-amber 2s ease-in-out infinite;
        }

        @keyframes pulse-amber {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .light-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: 'Share Tech Mono', 'Space Mono', monospace;
        }

        /* THE BUTTON - 1960s Industrial Control Panel Style */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .button-assembly {
            background: linear-gradient(180deg, #8a8a90 0%, #6a6a70 50%, #5a5a60 100%);
            border: 3px solid #4a4a50;
            border-radius: 8px;
            padding: 2rem 2.5rem 1.25rem;
            box-shadow: 
                inset 0 2px 0 #a0a0a6,
                inset 0 -2px 4px rgba(0,0,0,0.3),
                0 8px 24px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            position: relative;
        }

        /* Corner screws */
        .button-assembly::before,
        .button-assembly::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: 
                radial-gradient(circle at 40% 40%, #b0b0b6 0%, #707076 40%, #505056 100%);
            border-radius: 50%;
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.4),
                inset 0 -1px 2px rgba(0,0,0,0.4),
                0 1px 2px rgba(0,0,0,0.3);
        }

        .button-assembly::before {
            top: 10px;
            left: 10px;
        }

        .button-assembly::after {
            top: 10px;
            right: 10px;
        }

        .screw-bottom-left,
        .screw-bottom-right {
            position: absolute;
            width: 12px;
            height: 12px;
            background: 
                radial-gradient(circle at 40% 40%, #b0b0b6 0%, #707076 40%, #505056 100%);
            border-radius: 50%;
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.4),
                inset 0 -1px 2px rgba(0,0,0,0.4),
                0 1px 2px rgba(0,0,0,0.3);
            bottom: 10px;
        }

        .screw-bottom-left { left: 10px; }
        .screw-bottom-right { right: 10px; }

        /* Screw slots */
        .button-assembly::before,
        .button-assembly::after,
        .screw-bottom-left::after,
        .screw-bottom-right::after {
            background-image: 
                linear-gradient(90deg, transparent 40%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0.5) 55%, transparent 60%);
        }

        .screw-bottom-left::after,
        .screw-bottom-right::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(0,0,0,0.4) 45%, rgba(0,0,0,0.4) 55%, transparent 60%);
            border-radius: 50%;
        }

        .button-housing {
            background: linear-gradient(180deg, #1a1a1e 0%, #0a0a0c 100%);
            border: 4px solid #0a0a0c;
            border-radius: 50%;
            padding: 6px;
            box-shadow: 
                inset 0 2px 6px rgba(0,0,0,0.8),
                0 2px 4px rgba(0,0,0,0.4),
                0 0 0 2px #3a3a40;
        }

        .big-red-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            background: 
                linear-gradient(180deg, 
                    #e85555 0%, 
                    #d44444 20%,
                    #c43c3c 50%,
                    #b83232 80%,
                    #a02828 100%);
            cursor: pointer;
            box-shadow: 
                inset 0 2px 4px rgba(255,150,150,0.4),
                inset 0 -2px 6px rgba(0,0,0,0.3),
                0 4px 0 #6a1818,
                0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.08s ease;
            position: relative;
        }

        /* Flat top highlight reflection */
        .big-red-button::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 15%;
            width: 70%;
            height: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 50%;
        }

        .big-red-button:hover {
            background: 
                linear-gradient(180deg, 
                    #f06666 0%, 
                    #e85555 20%,
                    #d44444 50%,
                    #c43c3c 80%,
                    #b03030 100%);
            box-shadow: 
                inset 0 2px 4px rgba(255,180,180,0.5),
                inset 0 -2px 6px rgba(0,0,0,0.25),
                0 4px 0 #6a1818,
                0 6px 16px rgba(0,0,0,0.4),
                0 0 20px rgba(196, 60, 60, 0.3);
        }

        .big-red-button:active {
            transform: translateY(3px);
            box-shadow: 
                inset 0 2px 4px rgba(255,150,150,0.3),
                inset 0 -1px 4px rgba(0,0,0,0.3),
                0 1px 0 #6a1818,
                0 2px 8px rgba(0,0,0,0.4);
        }

        .big-red-button:focus {
            outline: 3px solid var(--accent-amber);
            outline-offset: 6px;
        }

        .button-label-plate {
            background: linear-gradient(180deg, #2a2a2e 0%, #1a1a1e 100%);
            border: 2px solid #0a0a0c;
            border-radius: 3px;
            padding: 0.5rem 1.5rem;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                0 2px 4px rgba(0,0,0,0.2);
        }

        .button-label {
            font-size: 0.85rem;
            color: #f0f0f0;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-family: 'Russo One', 'Share Tech Mono', monospace;
            margin: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        [data-theme="light"] .button-assembly {
            background: linear-gradient(180deg, #c0c0c4 0%, #a8a8ac 50%, #989898 100%);
            border-color: #808084;
        }

        [data-theme="light"] .button-housing {
            background: linear-gradient(180deg, #3a3a3e 0%, #2a2a2e 100%);
            border-color: #2a2a2e;
            box-shadow: 
                inset 0 2px 6px rgba(0,0,0,0.6),
                0 2px 4px rgba(0,0,0,0.2),
                0 0 0 2px #707074;
        }

        [data-theme="light"] .button-label-plate {
            background: linear-gradient(180deg, #3a3a3e 0%, #2a2a2e 100%);
            border-color: #1a1a1e;
        }

        /* Result Display */
        .result-display {
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            border: 3px solid var(--accent-amber);
            border-radius: 8px;
            text-align: center;
            background: var(--bg-panel);
            box-shadow: 
                0 0 20px rgba(212, 168, 60, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .result-display.visible {
            display: block;
            animation: resultAppear 0.4s ease;
        }

        @keyframes resultAppear {
            0% { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95);
            }
            50% {
                transform: translateY(5px) scale(1.02);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--accent-amber);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.75rem;
            font-family: 'Share Tech Mono', 'Space Mono', monospace;
        }

        .result-name {
            font-family: 'Russo One', sans-serif;
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            padding: 1rem;
            background: var(--bg-inset);
            border: 2px solid var(--border-heavy);
            border-radius: 4px;
        }

        .try-again {
            background: var(--bg-inset);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            font-family: 'Share Tech Mono', 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .try-again:hover,
        .try-again:focus {
            border-color: var(--text-secondary);
            color: var(--text-primary);
            outline: none;
        }

        /* Footer */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        footer a:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
                padding-top: 4rem;
            }

            .back-link {
                top: 0.75rem;
                left: 0.75rem;
                font-size: 0.7rem;
                padding: 0.4rem 0.6rem;
            }

            .theme-toggle {
                top: 0.75rem;
                right: 0.75rem;
                padding: 0.35rem 0.5rem;
                gap: 0.4rem;
            }
            
            .theme-toggle-label {
                font-size: 0.65rem;
            }
            
            .toggle-switch {
                width: 34px;
                height: 18px;
            }
            
            .toggle-switch::after {
                width: 12px;
                height: 12px;
            }
            
            [data-theme="light"] .toggle-switch::after {
                transform: translateX(14px);
            }

            .control-panel {
                padding: 1.5rem 1rem 2rem;
            }
            
            .control-panel::before,
            .control-panel::after {
                font-size: 0.7rem;
                top: 0.5rem;
            }
            
            .control-panel::before { left: 0.5rem; }
            .control-panel::after { right: 0.5rem; }
            
            .warning-title {
                font-size: 1.2rem;
            }
            
            .warning-subtitle {
                font-size: 0.85rem;
            }
            
            .button-assembly {
                padding: 1.5rem 1.75rem 1rem;
            }

            .big-red-button {
                width: 100px;
                height: 100px;
            }

            .status-row {
                gap: 1.25rem;
            }
            
            .result-name {
                font-size: 1.2rem;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Categories</a>

    <div class="theme-toggle">
        <span class="theme-toggle-label" id="theme-label">Dark</span>
        <button class="toggle-switch" 
                role="switch" 
                aria-checked="false" 
                aria-labelledby="theme-label"
                onclick="toggleTheme()"
                tabindex="0">
        </button>
    </div>

    <main class="control-panel">
        <div class="warning-header">
            <div class="warning-stripes" aria-hidden="true"></div>
            <div class="warning-label">For Indecision Emergencies Only</div>
            <h1 class="warning-title">Emergency Name Assignment</h1>
            <p class="warning-subtitle">When choice paralysis strikes, let fate decide. Press the button. Accept your destiny.</p>
        </div>

        <div class="status-row">
            <div class="status-light">
                <div class="light-indicator active"></div>
                <span class="light-label">System</span>
            </div>
            <div class="status-light">
                <div class="light-indicator standby"></div>
                <span class="light-label">Standby</span>
            </div>
            <div class="status-light">
                <div class="light-indicator active"></div>
                <span class="light-label">Ready</span>
            </div>
        </div>

        <div class="button-container">
            <div class="button-assembly">
                <span class="screw-bottom-left" aria-hidden="true"></span>
                <span class="screw-bottom-right" aria-hidden="true"></span>
                <div class="button-housing">
                    <button class="big-red-button" onclick="assignName()" aria-label="Generate random team name">
                    </button>
                </div>
                <div class="button-label-plate">
                    <span class="button-label">Assign Name</span>
                </div>
            </div>
        </div>

        <div class="result-display" id="result">
            <div class="result-label">Your Assigned Team Name</div>
            <div class="result-name" id="team-name"></div>
            <button class="try-again" onclick="assignName()">Try Again (No Judgment)</button>
        </div>
    </main>

    <footer>
        <p>You pushed the button. <a href="index.html">Try choosing a category</a> next time.</p>
    </footer>

    <script src="js/names.js"></script>
    <script>
        // Emergency names (fallback if names.js isn't loaded)
        const emergencyNames = [

            "We Couldn't Decide",
            "Winner by Default",
            "The Emergency Button Pushers",
            "Picked Under Pressure",
            "Time Ran Out",
            "The Deadline Made Us",
            "Roll the Dice",
            "The Path of Least Resistance",
            "Good Enough for Us",
            "Fate Decided",
            "The Overthinking It Club",
            "Team Task Failed Successfully",
            "Team This Was the Button's Idea",
            "Team We Outsourced This Decision",
            "Let the Algorithm Decide",
            "Democracy Has Failed Us",
            "We Voted and It Was a Tie"

        ];

        function assignName() {
            // Use names from names.js if available, otherwise use fallback
            const names = (typeof teamNames !== 'undefined' && teamNames.emergency) 
                ? teamNames.emergency 
                : emergencyNames;
            
            const randomName = names[Math.floor(Math.random() * names.length)];
            
            document.getElementById('team-name').textContent = randomName;
            const resultDisplay = document.getElementById('result');
            resultDisplay.classList.add('visible');
            
            // Update standby light to show "activated"
            const standbyLight = document.querySelector('.light-indicator.standby');
            standbyLight.style.background = 'var(--accent-green)';
            standbyLight.style.animation = 'none';
            
            // Smooth scroll to result
            setTimeout(() => {
                resultDisplay.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // Theme toggle functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            const toggle = document.querySelector('.toggle-switch');
            const label = document.getElementById('theme-label');
            toggle.setAttribute('aria-checked', newTheme === 'light');
            label.textContent = newTheme === 'light' ? 'Light' : 'Dark';
        }

        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const toggle = document.querySelector('.toggle-switch');
            const label = document.getElementById('theme-label');
            toggle.setAttribute('aria-checked', savedTheme === 'light');
            label.textContent = savedTheme === 'light' ? 'Light' : 'Dark';
        }

        // Keyboard support
        document.querySelector('.toggle-switch').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleTheme();
            }
        });

        loadTheme();
    </script>
</body>
</html>
